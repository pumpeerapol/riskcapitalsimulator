<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risk Capital Simulator</title>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      html, body, #root { height: 100%; }
      body { margin: 0; background: #0b0d14; font-family: var(--font-sans); }
      button { font: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      :focus-visible { outline: 3px solid #f5a623 !important; outline-offset: 3px; }
      section[aria-label="Scenario comparison"] button { background: #252a3d; color: #f0f2f8; border: 1px solid #4a526b; border-radius: 6px; padding: 10px 14px; }
      th, td { vertical-align: top; }
      summary { cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
